<!doctype html>
<html lang="en" data-api="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Review Sentiment</title>
<meta name="description" content="Type a movie review and a TF-IDF + logistic regression model tells you if it's positive or negative.">
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2da;--pos:#1f8a70;--neg:#c8433a;--accent:#2b2a27}
  @media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#201f1d;--ink:#f0eee8;--mute:#a09e96;--line:#34322e;--pos:#4cc3a3;--neg:#ee7a70;--accent:#f0eee8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 16px 56px}
  h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--mute);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;color:var(--ink);background:var(--bg)}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px}
  button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);padding:8px 20px;font-weight:600}
  button:hover{opacity:.85}
  .ex{font-size:.85rem;color:var(--mute)}
  #result{margin-top:20px;display:none}
  .verdict{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .verdict b{font-size:1.5rem}
  .pos{color:var(--pos)}.neg{color:var(--neg)}
  .bar{height:10px;border-radius:99px;background:var(--neg);overflow:hidden;margin:12px 0 4px}
  .bar i{display:block;height:100%;background:var(--pos);width:50%;transition:width .3s}
  .scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{border-radius:999px;padding:2px 10px;font-size:.85rem;border:1px solid currentColor}
  h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 0}
  .note{color:var(--mute);font-size:.85rem;margin-top:24px}
  .note a{color:inherit}
  #err{color:var(--neg);margin-top:12px;display:none}
</style>
</head>
<body>
<main>
  <h1>Movie Review Sentiment</h1>
  <p class="sub">Paste a review. A TF-IDF + logistic regression model decides if it's positive or negative and shows the words behind the call.</p>

  <div class="card">
    <label for="text" class="ex">Your review</label>
    <textarea id="text" placeholder="e.g. A tense, beautifully shot thriller with a brilliant lead performance."></textarea>
    <div class="row">
      <button class="primary" id="go">Analyze</button>
      <span class="ex">Try:</span>
      <button class="exb">A warm, funny film with a brilliant cast. Loved it.</button>
      <button class="exb">Boring, predictable and way too long. Not worth it.</button>
      <button class="exb">Not bad at all, actually quite good!</button>
    </div>
    <div id="err"></div>
    <div id="result">
      <div class="verdict"><b id="label"></b><span id="conf" class="ex"></span></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="scale"><span>negative</span><span>positive</span></div>
      <h2>Words that drove the decision</h2>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <p class="note" id="metrics"></p>
</main>

<script>
(function(){
  const API = document.documentElement.dataset.api || "";
  const $ = id => document.getElementById(id);
  let model = null;

  async function loadModel(){
    if (model) return model;
    model = await (await fetch("model.json")).json();
    model.stop = new Set(model.stop_words);
    return model;
  }

  // Same math as scikit-learn: tokenise -> drop stop-words -> unigrams+bigrams -> tf*idf -> L2 -> logistic
  function localPredict(m, text){
    const toks = (text.toLowerCase().match(/[a-z']+/g) || []).filter(t => !m.stop.has(t));
    const grams = toks.slice();
    for (let i = 0; i < toks.length - 1; i++) grams.push(toks[i] + " " + toks[i+1]);
    const counts = {};
    for (const g of grams) if (g in m.vocab) counts[g] = (counts[g] || 0) + 1;
    const terms = Object.keys(counts);
    let norm = 0;
    const w = terms.map(t => { const v = counts[t] * m.idf[m.vocab[t]]; norm += v*v; return [t, v]; });
    norm = Math.sqrt(norm) || 1;
    let z = m.intercept;
    const contrib = w.map(([t, v]) => { const c = (v / norm) * m.coef[m.vocab[t]]; z += c; return {word: t, weight: c}; });
    contrib.sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight));
    const p = 1 / (1 + Math.exp(-z));
    return {label: p >= .5 ? "positive" : "negative", confidence: Math.max(p, 1-p), prob_positive: p,
            top_words: contrib.slice(0, 6), known_words: terms.length};
  }

  async function analyze(){
    const text = $("text").value.trim();
    $("err").style.display = "none";
    if (!text){ return showErr("Type or paste a review first."); }
    try {
      let r;
      if (API){
        const res = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({review: text})});
        r = await res.json();
        if (!res.ok) return showErr(r.error || "Request failed");
      } else {
        r = localPredict(await loadModel(), text);
      }
      render(r);
    } catch(e){ showErr("Something went wrong: " + e.message); }
  }

  function showErr(msg){ $("err").textContent = msg; $("err").style.display = "block"; $("result").style.display = "none"; }

  function render(r){
    const pos = r.label === "positive";
    $("label").textContent = pos ? "Positive" : "Negative";
    $("label").className = pos ? "pos" : "neg";
    $("conf").textContent = (r.confidence * 100).toFixed(0) + "% confident";
    $("barfill").style.width = (r.prob_positive * 100).toFixed(1) + "%";
    const chips = $("chips"); chips.textContent = "";
    if (!r.top_words.length){
      chips.textContent = "No words from the model's vocabulary were found, so this is a low-information guess.";
    }
    for (const t of r.top_words){
      const s = document.createElement("span");
      s.className = "chip " + (t.weight >= 0 ? "pos" : "neg");
      s.textContent = t.word;
      chips.appendChild(s);
    }
    $("result").style.display = "block";
  }

  $("go").addEventListener("click", analyze);
  $("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze(); });
  document.querySelectorAll(".exb").forEach(b => b.addEventListener("click", () => { $("text").value = b.textContent; analyze(); }));

  fetch("metrics.json").then(r => r.json()).then(m => {
    const h = m.final_model.on_handwritten_test;
    $("metrics").textContent = "Accuracy on " + h.n + " held-out hand-written reviews: " + (h.accuracy*100).toFixed(0) +
      "%. Trained mostly on template-generated data, so it is a learning project, not a production classifier.";
  }).catch(() => {});
})();
</script>
</body>
</html>
